<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f7fb">
  <title>图标库 · Pirate Ship</title>
  <style>
    :root {
      color-scheme: light;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f6f7fb;
      color: #17223d;
      font-synthesis: none;
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-inline-size: 280px; }
    input { font: inherit; }
    a { color: inherit; }
    .shell { inline-size: min(100% - 48px, 1120px); margin-inline: auto; }
    .visually-hidden {
      position: absolute; inline-size: 1px; block-size: 1px; padding: 0; margin: -1px;
      overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0;
    }

    .site-header {
      display: flex; align-items: center; justify-content: space-between; gap: 24px;
      padding-block: 48px 32px; border-bottom: 1px solid #dce2ed;
    }
    h1 { margin: 0; font-size: clamp(28px, 3vw, 36px); line-height: 1.15; letter-spacing: -.04em; }
    .search-field { inline-size: min(100%, 340px); }
    .search-field input {
      inline-size: 100%; min-block-size: 46px; padding-inline: 16px;
      border: 1px solid #dce2ed; border-radius: 12px;
      background: #fff; color: #17223d;
    }
    .search-field input::placeholder { color: #626d83; }
    .search-field input:focus-visible { outline: 3px solid #3459d8; outline-offset: 2px; }

    main { padding-block-end: 64px; }
    .group { padding-block-start: 30px; }
    .group:not([hidden]) ~ .group:not([hidden]) { margin-block-start: 34px; border-top: 1px solid #dce2ed; }
    .group h2 { margin: 0 0 18px; font-size: 17px; line-height: 1.4; font-weight: 700; letter-spacing: -.01em; }
    /* Auto-filled tracks keep their width when filtering leaves a short final row. */
    .icon-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 112px), 1fr)); gap: 14px; }
    .icon-card {
      display: grid; justify-items: center; align-content: start; gap: 10px;
      min-block-size: 130px; padding: 5px 4px 8px;
      border-radius: 14px; text-align: center; text-decoration: none;
      transition: background-color .16s ease;
    }
    .icon-card:hover { background: #e9eeff; }
    .icon-card:focus-visible { outline: 3px solid #3459d8; outline-offset: 2px; }
    .icon-card[hidden], .group[hidden] { display: none; }
    .icon-frame {
      display: grid; place-items: center; inline-size: 82px; block-size: 82px;
      border: 1px solid #e0e5ef; border-radius: 18px; background: #fff;
    }
    .icon-frame img { display: block; max-inline-size: 68px; max-block-size: 68px; object-fit: contain; border-radius: 13px; }
    .icon-name { max-inline-size: 100%; font-size: 13px; font-weight: 500; line-height: 1.4; overflow-wrap: anywhere; }
    .empty, .error { padding-block: 52px; color: #626d83; text-align: center; }

    @media (max-width: 620px) {
      .shell { inline-size: min(100% - 32px, 1120px); }
      .site-header { display: grid; grid-template-columns: minmax(0, 1fr); gap: 18px; padding-block: 28px 24px; }
      .search-field { inline-size: 100%; }
      .group { padding-block-start: 24px; }
      .group:not([hidden]) ~ .group:not([hidden]) { margin-block-start: 24px; }
      .icon-grid { grid-template-columns: repeat(auto-fill, minmax(min(100%, 98px), 1fr)); gap: 12px 10px; }
      .icon-card { min-block-size: 116px; }
      .icon-frame { inline-size: 76px; block-size: 76px; }
      .icon-frame img { max-inline-size: 62px; max-block-size: 62px; }
    }
    @media (prefers-reduced-motion: reduce) { .icon-card { transition: none; } }
  </style>
</head>
<body>
  <header class="site-header shell">
    <h1>图标库</h1>
    <div class="search-field">
      <label class="visually-hidden" for="search">搜索图标</label>
      <input id="search" type="search" placeholder="搜索图标" autocomplete="off">
    </div>
  </header>
  <main class="shell" id="groups" aria-label="图标分组"></main>
  <script>
    const search = document.querySelector('#search');
    const groups = document.querySelector('#groups');
    const sections = [];

    function createCard(icon) {
      // Parse catalog data into DOM nodes; never interpolate labels as HTML.
      let file;
      try { file = new URL(icon.url).pathname.split('/').at(-1); }
      catch (_) { return null; }
      if (!/^[a-z0-9-]+\.png$/.test(file)) return null;
      const link = document.createElement('a');
      link.className = 'icon-card';
      link.href = file;
      link.setAttribute('aria-label', `${icon.label}，查看原图`);
      const frame = document.createElement('span');
      frame.className = 'icon-frame';
      const image = document.createElement('img');
      image.src = file;
      image.alt = '';
      image.loading = 'lazy';
      image.decoding = 'async';
      frame.append(image);
      const name = document.createElement('span');
      name.className = 'icon-name';
      name.textContent = icon.label;
      link.append(frame, name);
      return { element: link, text: `${icon.label} ${icon.keywords} ${icon.id}`.toLocaleLowerCase() };
    }

    function filter() {
      const terms = search.value.trim().toLocaleLowerCase().split(/\s+/).filter(Boolean);
      let matches = 0;
      for (const section of sections) {
        let visible = 0;
        for (const card of section.cards) {
          const match = terms.every(term => card.text.includes(term));
          card.element.hidden = !match;
          if (match) visible++;
        }
        section.element.hidden = visible === 0;
        matches += visible;
      }
      let empty = groups.querySelector('.empty');
      if (matches === 0 && !empty) {
        empty = document.createElement('p');
        empty.className = 'empty';
        empty.setAttribute('role', 'status');
        empty.textContent = '无结果';
        groups.append(empty);
      } else if (matches > 0) {
        empty?.remove();
      }
    }

    async function load() {
      try {
        const response = await fetch('icons.json');
        if (!response.ok) throw new Error('Catalog request failed');
        const icons = await response.json();
        if (!Array.isArray(icons)) throw new Error('Invalid catalog');
        const byGroup = new Map();
        for (const icon of icons) {
          if (!icon || typeof icon.label !== 'string' || typeof icon.keywords !== 'string' ||
              typeof icon.id !== 'string' || typeof icon.group !== 'string' || typeof icon.url !== 'string') continue;
          const card = createCard(icon);
          if (!card) continue;
          if (!byGroup.has(icon.group)) byGroup.set(icon.group, []);
          byGroup.get(icon.group).push(card);
        }
        for (const [group, cards] of byGroup) {
          const section = document.createElement('section');
          section.className = 'group';
          const title = document.createElement('h2');
          title.textContent = group;
          const grid = document.createElement('div');
          grid.className = 'icon-grid';
          grid.append(...cards.map(card => card.element));
          section.append(title, grid);
          groups.append(section);
          sections.push({ element: section, cards });
        }
        filter();
      } catch (_) {
        const message = document.createElement('p');
        message.className = 'error';
        message.setAttribute('role', 'alert');
        message.textContent = '加载失败';
        groups.append(message);
      }
    }

    // Filtering is local; the search text never leaves the browser.
    search.addEventListener('input', filter);
    load();
  </script>
</body>
</html>
